name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build evaluates the env schema at module load, so these have to be
      # present and schema-valid. They are deliberately fake: nothing in
      # typecheck, lint, test or build makes a network call, and a CI job that
      # needs real credentials to compile is a CI job that cannot run on forks.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.ci
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.ci
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
      GEMINI_API_KEY: AIzaSyPlaceholderCiKey000000000000000000
      WORKER_SECRET: placeholder-ci-secret-value-not-real

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types come from the schema, so this has to precede typecheck.
      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec next build

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/renderer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Browsers are a ~400MB download and nothing here launches one.
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: npx tsc --noEmit
