# Local stack: the app, the renderer, and a Postgres to point DATABASE_URL at.
# Supabase Auth and Storage are not reproduced here — those stay hosted even in
# local development, because faking them well enough to be useful costs more
# than it saves.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: ${NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET:-ad-screenshots}
        NEXT_PUBLIC_STRIPE_PRICE_PRO: ${NEXT_PUBLIC_STRIPE_PRICE_PRO:-}
        NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE: ${NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE:-}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      RENDERER_URL: http://renderer:4000
    depends_on:
      renderer:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    build:
      context: ./services/renderer
    environment:
      RENDERER_SECRET: ${RENDERER_SECRET:-dev-secret}
      RENDERER_CONCURRENCY: "3"
    ports:
      - "4000:4000"
    # Chromium's default 64MB of shared memory in a container causes tab
    # crashes that present as random timeouts.
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adfit
      POSTGRES_PASSWORD: adfit
      POSTGRES_DB: adfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adfit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
